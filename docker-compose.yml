services:
  app:
    build: .
    container_name: taskhub-api

    ports:
      - "8000:8000"

    env_file:
      - .env.docker

    volumes:
      - .:/app

    depends_on:
      - mysql
      - redis

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

  mysql:
    image: mysql:8.4
    container_name: taskhub-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: thuhuong7726
      MYSQL_DATABASE: taskhub

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: taskhub-redis

    restart: always

    ports:
      - "6379:6379"

volumes:
  mysql_data: